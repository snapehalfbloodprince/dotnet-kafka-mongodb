services:
  broker:
    image: apache/kafka:4.2.0
    container_name: kafka-router-broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:19092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

    volumes:
      - kafka_data:/tmp/kraft-combined-logs

    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  kafka-init-topics:
    image: apache/kafka:4.2.0
    container_name: kafka-router-init-topics
    depends_on:
      broker:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "
      echo 'Attendo che Kafka sia disponibile...';

      until /opt/kafka/bin/kafka-topics.sh --bootstrap-server broker:19092 --list > /dev/null 2>&1;
      do
        echo 'Kafka non ancora pronto, attendo...';
        sleep 2;
      done;

      echo 'Kafka disponibile. Creo i topic...';

      /opt/kafka/bin/kafka-topics.sh --bootstrap-server broker:19092 --create --if-not-exists --topic events.inbound --partitions 3 --replication-factor 1;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server broker:19092 --create --if-not-exists --topic events.crm --partitions 3 --replication-factor 1;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server broker:19092 --create --if-not-exists --topic events.billing --partitions 3 --replication-factor 1;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server broker:19092 --create --if-not-exists --topic events.notifications --partitions 3 --replication-factor 1;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server broker:19092 --create --if-not-exists --topic events.dead-letter --partitions 3 --replication-factor 1;

      echo 'Topic Kafka creati/verificati:';
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server broker:19092 --list;

      echo 'Inizializzazione topic completata.';
      "

  mongodb:
    image: mongo:8.0
    container_name: kafka-router-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: >
        mongosh --username root --password rootpassword --authenticationDatabase admin
        --eval "db.adminCommand('ping')" --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mongo-express:
    image: mongo-express:latest
    container_name: kafka-router-mongo-express
    depends_on:
      - mongodb
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: rootpassword
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin

  kafka-router-worker:
    build:
      context: ..
      dockerfile: src/KafkaRouter.Worker/Dockerfile
    image: kafka-router-worker:local
    restart: unless-stopped
    stop_grace_period: 40s
    depends_on:
      kafka-init-topics:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
    expose:
      - "8080"
    environment:
      DOTNET_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://0.0.0.0:8080

      Kafka__BootstrapServers: broker:19092
      Kafka__InputTopic: events.inbound
      Kafka__DeadLetterTopic: events.dead-letter
      Kafka__ConsumerGroupId: kafka-router-worker-local
      Kafka__AutoOffsetReset: Earliest

      MongoDb__ConnectionString: mongodb://root:rootpassword@mongodb:27017
      MongoDb__DatabaseName: kafka_router
      MongoDb__RoutingRulesCollectionName: routing_rules
      MongoDb__ProcessedMessagesCollectionName: processed_messages

      Worker__ErrorDelayInSeconds: 5
      Worker__ConsecutiveFailuresWarningThreshold: 5
      Worker__TechnicalRetryMaxAttempts: 3
      Worker__TechnicalRetryInitialDelayInSeconds: 1
      Worker__TechnicalRetryMaxDelayInSeconds: 10
      Worker__ShutdownTimeoutInSeconds: 30

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  kafka_data:
  mongodb_data: